name: PS4 build
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ps4.yml']
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip
      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=OpenOrbis/OpenOrbis-PS4-Toolchain
          mkdir -p $HOME/oo
          cd $HOME/oo
          gh release download --repo $R --pattern '*.tar.gz' || gh release download --repo $R --pattern '*.zip'
          for f in *.tar.gz; do if [ -f "$f" ]; then tar xzf "$f"; fi; done
          for f in *.zip; do if [ -f "$f" ]; then unzip -q "$f"; fi; done
          ROOT=$(dirname "$(find $HOME/oo -type d -name samples | head -1)")
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> $GITHUB_ENV
          chmod -R +x $ROOT/bin/linux
      - name: Show SDL2 sample
        run: |
          cd $OO_PS4_TOOLCHAIN/samples/SDL2/SDL2
          echo "=== main.cpp ==="; cat main.cpp
          echo "=== Game.h ==="; cat Game.h
          echo "=== Game.cpp ==="; head -120 Game.cpp   
      - name: Build graphics samples
        run: |
          for s in graphics input SDL2 piglet; do
            echo "=== BUILD $s ==="
            (cd $OO_PS4_TOOLCHAIN/samples/$s && make) || echo "FAILED: $s"
          done
      - name: Collect pkg
        run: |
          mkdir out
          for s in graphics input SDL2 piglet; do
            for p in $(find $OO_PS4_TOOLCHAIN/samples/$s -name '*.pkg'); do
              cp "$p" "out/${s}_$(basename $p)"
            done
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-test-pkg
          path: out/
          if-no-files-found: error
