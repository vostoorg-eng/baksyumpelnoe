name: PS4 build
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ps4.yml','ps4/**']
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip
      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=OpenOrbis/OpenOrbis-PS4-Toolchain
          mkdir -p $HOME/oo
          cd $HOME/oo
          gh release download --repo $R --pattern '*.tar.gz' || gh release download --repo $R --pattern '*.zip'
          for f in *.tar.gz; do if [ -f "$f" ]; then tar xzf "$f"; fi; done
          for f in *.zip; do if [ -f "$f" ]; then unzip -q "$f"; fi; done
          ROOT=$(dirname "$(find $HOME/oo -type d -name samples | head -1)")
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> $GITHUB_ENV
          chmod -R +x $ROOT/bin/linux
      - name: Build Baksyumpelnoe
        run: |
          cd $OO_PS4_TOOLCHAIN/samples
          rm -rf baksyumpelnoe
          cp -r SDL2 baksyumpelnoe
          cd baksyumpelnoe
          mv SDL2 baksyumpelnoe
          rm -f baksyumpelnoe/*.cpp baksyumpelnoe/*.h baksyumpelnoe/*.bat baksyumpelnoe/*.vcxproj*
          cp $GITHUB_WORKSPACE/ps4/main.cpp $GITHUB_WORKSPACE/ps4/game.h baksyumpelnoe/
          sed -i 's/BREW00090/BAKS00001/g; s/SDLEXAMPLE000000/BAKSYUMPELNOE000/g; s/OpenOrbis SDL Sample/Baksyumpelnoe/' Makefile
          rm -f sce_sys/param.sfo
          make
      - name: Collect pkg
        run: |
          mkdir out
          find $OO_PS4_TOOLCHAIN/samples/baksyumpelnoe -name '*.pkg' -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: baksyumpelnoe-ps4
          path: out/
          if-no-files-found: error
