name: PS4 build
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ps4.yml']
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip
      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=OpenOrbis/OpenOrbis-PS4-Toolchain
          gh release view --repo $R --json tagName,assets -q '.tagName, (.assets[].name)'
          mkdir -p $HOME/oo
          cd $HOME/oo
          gh release download --repo $R --pattern '*.tar.gz' || gh release download --repo $R --pattern '*.zip'
          ls -l
          for f in *.tar.gz; do if [ -f "$f" ]; then tar xzf "$f"; fi; done
          for f in *.zip; do if [ -f "$f" ]; then unzip -q "$f"; fi; done
          ROOT=$(dirname "$(find $HOME/oo -type d -name samples | head -1)")
          echo "Toolchain root: $ROOT"
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> $GITHUB_ENV
          chmod -R +x $ROOT/bin/linux
      - name: Build hello_world sample
        run: |
          cd $OO_PS4_TOOLCHAIN/samples/hello_world
          make
      - name: Collect pkg
        run: |
          mkdir out
          find $OO_PS4_TOOLCHAIN/samples/hello_world -name '*.pkg' -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-test-pkg
          path: out/
          if-no-files-found: error
