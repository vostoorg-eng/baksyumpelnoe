<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Баксюмпельное 3D</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;font-family:sans-serif}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;image-rendering:pixelated}
button{position:fixed;border-radius:50%;border:0;font-weight:bold;opacity:.85}
.a{bottom:30px;width:88px;height:88px;font-size:15px}
#bark{right:30px;background:#ffd54f}#grab{right:130px;background:#81c784}
#mb{top:10px;right:10px;width:64px;height:40px;border-radius:10px;background:#90caf9;font-size:13px}
#hud{position:fixed;left:10px;top:8px;color:#fff;font-size:13px;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
#bar{width:170px;height:12px;background:#000;border:2px solid #000;margin-top:4px}
#fill{height:100%;width:0;background:#ffb300}
#msg{position:fixed;left:50%;top:38%;transform:translateX(-50%);width:max-content;max-width:80%;background:rgba(0,0,0,.7);color:#fff;font-size:17px;padding:10px 16px;border-radius:8px;text-align:center;display:none;pointer-events:none}
#menu{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);color:#fff;padding:20px;box-sizing:border-box;overflow:auto}
#menu button{position:static;border-radius:10px;width:100%;padding:12px;margin:6px 0;background:#ffd54f;font-size:15px;opacity:1}
</style></head><body>
<canvas id="gl"></canvas>
<div id="hud"><div id="st"></div><div id="bar"><div id="fill"></div></div><div style="font-size:11px">Тревожность</div></div>
<div id="msg"></div>
<button class="a" id="grab">ВЗЯТЬ</button><button class="a" id="bark">ГАВ</button><button id="mb">МЕНЮ</button>
<div id="menu"></div>
<script>window.onerror=function(m,s,l){document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:60px;left:10px;right:10px;color:#f66;font-size:14px;z-index:9;white-space:pre-wrap">'+m+' / '+s+' / строка '+l+'</pre>')};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="logic.js?v=1"></script>
<script src="world.js?v=1"></script>
<script src="game.js?v=1"></script>
</body></html>
